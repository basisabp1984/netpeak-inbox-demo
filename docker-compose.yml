services:
  demo:
    build: .
    container_name: netpeak-demo
    restart: unless-stopped
    ports:
      - "127.0.0.1:8011:8000"   # наружу только через Caddy, не напрямую
    environment:
      # Токен доступа. Пусто = демо открыто (локальный режим).
      DEMO_ACCESS_TOKEN: ${DEMO_ACCESS_TOKEN:-}
    volumes:
      - demo-data:/srv/data

volumes:
  demo-data:
